[workspace]
resolver = "2"
members = ["crates/generic-service", "crates/trace-config", "crates/app-utils"]

# rpcstack is pinned to ONE git revision. Cargo does not let `[patch]` entries
# inherit from `[workspace.dependencies]`, so the same rev also appears in the
# patch table below; `scripts/check.sh` fails if the two ever differ.
[workspace.dependencies]
masa = { git = "https://github.com/rpcstack/rpcstack", rev = "de0cedc080882469b316c8125b7ad17a7c93e7fb" }
tonic = { git = "https://github.com/rpcstack/rpcstack", rev = "de0cedc080882469b316c8125b7ad17a7c93e7fb" }
tonic-build = { git = "https://github.com/rpcstack/rpcstack", rev = "de0cedc080882469b316c8125b7ad17a7c93e7fb", features = ["prost"] }
tokio = { git = "https://github.com/rpcstack/rpcstack", rev = "de0cedc080882469b316c8125b7ad17a7c93e7fb" }

# Crates.io dependants (mongodb, redis, ...) must link the same vendored Tokio
# and Hyper that rpcstack's hooks live in. Patches do not propagate from
# dependency workspaces, so every application workspace repeats them.
[patch.crates-io]
tokio = { git = "https://github.com/rpcstack/rpcstack", rev = "de0cedc080882469b316c8125b7ad17a7c93e7fb" }
hyper = { git = "https://github.com/rpcstack/rpcstack", rev = "de0cedc080882469b316c8125b7ad17a7c93e7fb" }

[profile.release]
debug = false
