[project]
name = "tracebench-tools"
version = "0.1.0"
description = "Generate Docker Compose and Kubernetes deployments for tracebench call graphs"
requires-python = ">=3.10"
dependencies = []  # standard library only

[project.scripts]
tracebench-deploy = "tracebench_deploy.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracebench_deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
