name: trace-analysis

on:
  push:
    branches: [main]
    paths: ["trace-analysis/**", ".github/workflows/trace-analysis.yml"]
  pull_request:
    paths: ["trace-analysis/**", ".github/workflows/trace-analysis.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trace-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run tests
        run: uv run pytest -q
