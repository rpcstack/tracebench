name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, check and test (both modes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check (fmt, rpcstack pin, single tokio/hyper, -D warnings, both modes)
        run: scripts/check.sh
      - name: Test (both modes)
        run: scripts/test.sh

  tools:
    name: tools (deployment generator tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Includes the check that the committed docker-compose.yaml and
      # deploy/default/ equal the generator's output.
      - name: Tests
        run: uv run --locked --group dev pytest -q

  compose-smoke:
    name: docker build + compose smoke (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, masa]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Dependencies are a separate cargo-chef layer (see Dockerfile); persist it
      # in the Actions cache so only this repository's crates compile when warm.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODE=${{ matrix.mode }}
          tags: rpcstack-tracebench:${{ matrix.mode }}
          load: true
          cache-from: type=gha,scope=tracebench-${{ matrix.mode }}
          cache-to: type=gha,scope=tracebench-${{ matrix.mode }},mode=max
      - name: Compose smoke
        env:
          SKIP_BUILD: "1"
        run: scripts/smoke-compose.sh ${{ matrix.mode }}
      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-compose-${{ matrix.mode }}
          path: out/
