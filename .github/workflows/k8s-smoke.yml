name: Kubernetes smoke

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

jobs:
  kind-smoke:
    name: kind smoke (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, masa]
    steps:
      - uses: actions/checkout@v4
      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - uses: docker/setup-buildx-action@v3
      - name: Start kind cluster and registry
        run: scripts/kind-up.sh
      # Same Dockerfile, build args and cache scope as the Compose smoke in ci.yml.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODE=${{ matrix.mode }}
          tags: localhost:5001/rpcstack-tracebench:${{ matrix.mode }}
          load: true
          cache-from: type=gha,scope=tracebench-${{ matrix.mode }}
          cache-to: type=gha,scope=tracebench-${{ matrix.mode }},mode=max
      - name: Push image to the kind registry
        run: docker push localhost:5001/rpcstack-tracebench:${{ matrix.mode }}
      - name: kind smoke
        env:
          SKIP_BUILD: "1"
        run: scripts/smoke-k8s.sh ${{ matrix.mode }}
      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-k8s-${{ matrix.mode }}
          path: out/
      - name: Tear down
        if: always()
        run: scripts/kind-down.sh
