[package]
name = "app-utils"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
# Pass-through Masa features that change load-generator behaviour.
ac_rajomon = ["masa/ac_rajomon"]
trace_queue_latency = ["masa/trace_queue_latency"]

[dependencies]
masa = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tonic = { workspace = true }
rand = "0.8"
rand_distr = "0.4"
structopt = "0.3.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.9"
