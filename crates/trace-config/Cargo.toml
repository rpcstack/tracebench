[package]
name = "trace-config"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.100"
masa = { workspace = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
ordered-float = "5.0.0"
rand = "0.9.0"
rand_distr = "0.5.1"
csv = "1.3.1"
tracing = "0.1.41"

[dev-dependencies]
tempfile = "3.22.0"
