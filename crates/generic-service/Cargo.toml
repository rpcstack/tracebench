[package]
name = "generic-service"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "generic_service"
path = "src/lib.rs"

[[bin]]
name = "generic-service"
path = "src/main.rs"

[[bin]]
name = "tracebench-loadgen"
path = "src/loadgen.rs"

[[bin]]
name = "tracebench-probe"
path = "src/probe.rs"

[features]
# Policy modes. `baseline` (no features) leaves `masa::DefaultHooks` as
# `tonic::rpcstack::noop::NoopHooks`. `masa` is the composed Masa policy preset
# documented in rpcstack's examples/masa/README.md.
default = []
baseline = []
masa = ["sched_slo", "abort_slo", "signal_slack", "est_mean_var", "ac_pred"]

# Individual Masa features, passed through unchanged.
sched_slo = ["masa/sched_slo"]
sched_mt = ["masa/sched_mt"]
sched_mt_multiqueue = ["sched_mt", "masa/sched_mt_multiqueue"]
sched_tailclipper = ["masa/sched_tailclipper"]
sched_fifo = ["masa/sched_fifo"]
sched_oracle = ["masa/sched_oracle"]
sched_pred = ["masa/sched_pred"]
abort_slo = ["masa/abort_slo"]
abort_slack = ["masa/abort_slack"]
signal_slack = ["masa/signal_slack"]
estimator = ["masa/estimator"]
ac_pred = ["masa/ac_pred"]
ac_rajomon = ["masa/ac_rajomon", "app-utils/ac_rajomon"]
est_rms = ["masa/est_rms"]
est_hist = ["masa/est_hist"]
est_mean_var = ["masa/est_mean_var"]
trace_queue_latency = ["masa/trace_queue_latency", "app-utils/trace_queue_latency"]
deadline_equals_slack = ["masa/deadline_equals_slack"]
stack_custom = ["masa/stack_custom"]
sched_custom = ["masa/sched_custom"]

[dependencies]
anyhow = "1.0"
app-utils = { path = "../app-utils" }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
masa = { workspace = true }
prost = "0.12"
prost-types = "0.12"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "sync", "fs", "signal"] }
tonic = { workspace = true }
trace-config = { path = "../trace-config" }
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = { workspace = true }
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3.13"
